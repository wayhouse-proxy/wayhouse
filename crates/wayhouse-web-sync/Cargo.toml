[package]
name = "wayhouse-web-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "wayhouse_web_sync"
path = "src/lib.rs"

[[bin]]
name = "wayhouse-web-sync"
path = "src/main.rs"

[lints]
workspace = true

# Deliberately no wayhouse-core: the sync is a separate process so that a bug or hang
# here cannot touch the data path. wayhouse-config is only the serialisable `WebView`.
[dependencies]
wayhouse-config = { path = "../wayhouse-config" }
wayhouse-http = { workspace = true, features = ["server"] }
tokio = { workspace = true, features = ["fs"] }
axum.workspace = true
clap = { workspace = true, features = ["env"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
metrics.workspace = true

[dev-dependencies]
tempfile.workspace = true
