[package]
name = "wayhouse-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The one place the fleet binaries build outbound HTTP clients (`--ca-file`) and,
# behind the `server` feature, the native-TLS HTTPS listener (`tls`).
# No wayhouse-core / wayhouse-config: wayhouse-aggregator and wayhouse-ui depend on it and must stay
# free of them.

[features]
# On by default so `cargo test -p wayhouse-http` covers `tls`. The workspace dependency
# turns defaults off: every fleet binary that serves HTTP asks for `server`, and
# wayhouse-agent, a client only, doesn't build axum/rustls-server through here.
default = ["server"]
# Lets `WAYHOUSE_TEST_PROTOCOL_MAJOR`/`_MINOR` override the announced protocol
# version. Only `wayhouse-fleet-tests` builds with it; no image does.
test-protocol-override = []
server = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:tower", "dep:tokio", "dep:tokio-rustls", "dep:arc-swap", "dep:clap", "dep:metrics", "dep:metrics-exporter-prometheus", "dep:socket2"]

[lints]
workspace = true

[dependencies]
reqwest.workspace = true
rustls.workspace = true
thiserror.workspace = true
url = "2"
# `http2`: TlsListener offers ALPN h2, so axum must be able to serve it (not
# only when another crate in the build happens to switch it on).
axum = { workspace = true, features = ["http2"], optional = true }
# The connection loop `serve` runs in place of `axum::serve`, so each connection gets a header-read
# timeout and a global cap (axum 0.8 offers neither).
hyper = { version = "1", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service", "http1", "http2"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tokio = { workspace = true, optional = true }
# TCP keepalive and a user timeout on accepted streams, so a half-open or stalled peer lets go of its slot.
socket2 = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }
tracing.workspace = true
# `TlsArgs`: the shared `--tls-cert`/`--tls-key` flags.
clap = { workspace = true, optional = true }
# Handshake counters; a no-op unless the binary installs a recorder (see `metrics`).
metrics = { workspace = true, optional = true }
# The `/metrics` recorder and route every fleet binary shares.
metrics-exporter-prometheus = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tempfile = { workspace = true }
http = "1"
tokio-stream = { workspace = true }
socket2 = { workspace = true }

# The TLS tests need the (default) `server` feature; skip them without it.
[[test]]
name = "tls_certs"
required-features = ["server"]

[[test]]
name = "tls_metrics"
required-features = ["server"]

[[test]]
name = "conn_limits"
required-features = ["server"]

[[test]]
name = "tls_server"
required-features = ["server"]

[[test]]
name = "protocol_metrics"
required-features = ["server"]

[[test]]
name = "harden"
required-features = ["server"]
