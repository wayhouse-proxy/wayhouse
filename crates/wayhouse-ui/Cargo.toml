[package]
name = "wayhouse-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "wayhouse_ui"
path = "src/lib.rs"

[[bin]]
name = "wayhouse-ui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
wayhouse-settings = { path = "../wayhouse-settings" }
wayhouse-http = { workspace = true, features = ["server"] }
tokio.workspace = true
axum = { workspace = true, features = ["ws"] }
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
rand.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
serde_norway.workspace = true
argon2 = "0.6.0"
wayhouse-registry = { path = "../wayhouse-registry" }
sha2.workspace = true
minisign-verify.workspace = true
wayhouse-plugin-abi = { path = "../wayhouse-plugin-abi" }
wayhouse-sniffer-abi = { path = "../wayhouse-sniffer-abi" }
semver.workspace = true
thiserror.workspace = true

[dev-dependencies]
wayhouse-config = { path = "../wayhouse-config", features = ["test-util"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false }
base64 = "0.22"
tempfile.workspace = true
wat.workspace = true
# HTTP/2 WebSocket (extended CONNECT) test client; all already in the lockfile.
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
