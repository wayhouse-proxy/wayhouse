[package]
name = "wayhouse-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sealed secrets at rest: the keyring file and XChaCha20-Poly1305 seal/open shared by the controller and the proxy."
publish = false

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
tracing.workspace = true
rand.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
zeroize = "1"

[dev-dependencies]
tempfile.workspace = true
