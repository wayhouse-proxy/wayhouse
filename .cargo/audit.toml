# Accepted RustSec advisories (cargo audit reads this file from .cargo/).
# Every entry needs a reason and a way out. No blanket ignores.

[advisories]
ignore = [
  # atomic-polyfill 1.0.3 via heapless 0.7 <- postcard, which both
  # wasmtime/cranelift-codegen and wayhouse-core (gossip) depend on. heapless
  # only pulls it in for avr and riscv32i targets, so it is not compiled into
  # any wayhouse target (x86_64, aarch64). cargo-audit applies this ID to every
  # resolved path. Remove the entry when no path in Cargo.lock contains
  # atomic-polyfill any more (postcard/heapless bump in both wasmtime and
  # wayhouse-core).
  "RUSTSEC-2023-0089", # atomic-polyfill
]
