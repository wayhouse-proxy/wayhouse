name: Release

# Publishes the seven reference images (deploy/Dockerfile) to GHCR for linux/amd64
# and linux/arm64 when a version tag is pushed. Nothing else triggers it, so it
# costs one build per architecture per release. Kubernetes packaging: issue #88.
#
# Nothing is published until everything passed (issue #112):
#   1. the tag is v<workspace version>, so the tag, the image tags and what
#      `--version` / wayhouse_build_info report agree;
#   2. the tagged commit is on main and CI succeeded on it;
#   3. all seven images build on a native runner of each architecture (no
#      emulation, no cross-compiling), each reports the version and carries the
#      commit, and the compose smoke test passes on them;
#   4. only then does the `publish` job push them: first the per-architecture
#      tags (`<version>-amd64`, `<version>-arm64`), then the multi-arch `<version>`
#      (and `latest`) tags that point at both. A build or smoke failure on either
#      architecture therefore leaves nothing public; only a registry error mid-push
#      can still leave a partial set (re-run the workflow: the pushes are idempotent).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04   # pinned like ci.yml
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read     # find CI's run for this commit
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # origin/main, to prove the tag is on it
          persist-credentials: false
      - name: Tag matches the workspace version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 .github/scripts/check_release_test.py
          python3 .github/scripts/check_version_policy_test.py
          python3 .github/scripts/check_version_policy.py >/dev/null
          echo "version=$(python3 .github/scripts/check_release.py "$TAG")" >> "$GITHUB_OUTPUT"
      - name: Only the highest stable tag moves `latest`
        id: latest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # A lower stable tag pushed later (a backport) must not move `latest` backwards.
          top=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -v -- '-' | sort -V | tail -n1)
          if [ "$TAG" = "$top" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "latest=false" >> "$GITHUB_OUTPUT"; fi
      - name: Tagged commit is on main and CI passed on it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git merge-base --is-ancestor "$SHA" origin/main ||
            { echo "::error::$SHA is not on main: release from a commit that main contains"; exit 1; }
          ok=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" \
                 --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          [ "$ok" -ge 1 ] || {
            echo "::error::no successful CI run for $SHA. Wait for CI on main, or run CI by hand (Actions > CI > Run workflow on main) if the commit changed only docs, then re-run this job."
            exit 1
          }

  # One native build per architecture. Builds, tests and labels the seven images,
  # then hands them to `publish` as a tarball; nothing is pushed from here.
  images:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04      # pinned like ci.yml
          - arch: arm64
            runner: ubuntu-24.04-arm  # free for public repos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      REGISTRY: ghcr.io
      IMAGES: wayhouse wayhouse-minimal wayhouse-controller wayhouse-aggregator wayhouse-ui wayhouse-control wayhouse-agent wayhouse-caddy
      ARCH: ${{ matrix.arch }}
      # The images whose `--version` is the wayhouse version; wayhouse-caddy is checked
      # against the Caddy pinned in deploy/Dockerfile by build-images.sh instead.
      WAYHOUSE_IMAGES: wayhouse wayhouse-minimal wayhouse-controller wayhouse-aggregator wayhouse-ui wayhouse-control wayhouse-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build all seven images, check version and commit, run the compose smoke test
        env:
          WAYHOUSE_GIT_SHA: ${{ github.sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -eu
          test "$(docker version --format '{{.Server.Arch}}')" = "$ARCH"
          BIN_SOURCE=builder sh deploy/build-images.sh
          for t in $WAYHOUSE_IMAGES; do
            out=$(docker run --rm "wayhouse-deploy/$t:local" --version)
            case "$out" in *" $VERSION ("*")") ;; *) echo "::error::$t --version is '$out', expected version $VERSION"; exit 1 ;; esac
          done
          make deploy-smoke
      # The images tested above, plus one metadata layer for the labels (same
      # filesystem layers), named for their final registry path and architecture.
      - name: Label and tag the images, save them for publish
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          owner=$(echo "${REPO%%/*}" | tr '[:upper:]' '[:lower:]')
          refs=""
          for t in $IMAGES; do
            ref="$REGISTRY/$owner/$t:$VERSION-$ARCH"
            # wayhouse-caddy is Caddy (Apache-2.0) plus our base config.
            licenses="MIT OR Apache-2.0"
            [ "$t" != wayhouse-caddy ] || licenses="Apache-2.0"
            printf 'FROM wayhouse-deploy/%s:local\n' "$t" | docker build \
              --label "org.opencontainers.image.source=https://github.com/$REPO" \
              --label "org.opencontainers.image.version=$VERSION" \
              --label "org.opencontainers.image.revision=$SHA" \
              --label "org.opencontainers.image.licenses=$licenses" \
              -t "$ref" -
            refs="$refs $ref"
          done
          mkdir -p "$RUNNER_TEMP/images"
          docker save -o "$RUNNER_TEMP/images/$ARCH.tar" $refs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-images-${{ matrix.arch }}
          path: ${{ runner.temp }}/images/${{ matrix.arch }}.tar
          retention-days: 1

  publish:
    needs: [verify, images]
    runs-on: ubuntu-24.04   # pinned like ci.yml
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to ghcr.io/<owner>/<image>
    env:
      REGISTRY: ghcr.io
      IMAGES: wayhouse wayhouse-minimal wayhouse-controller wayhouse-aggregator wayhouse-ui wayhouse-control wayhouse-agent wayhouse-caddy
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-images-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin
      - name: Load the images
        run: |
          set -eu
          for a in amd64 arm64; do docker load -i "$RUNNER_TEMP/images/$a.tar"; done
      - name: Push per-architecture tags, then the multi-arch tags
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          LATEST: ${{ needs.verify.outputs.latest }}
        run: |
          set -eu
          owner=$(echo "${REPO%%/*}" | tr '[:upper:]' '[:lower:]')
          # Pre-releases (v1.2.3-rc.1) get their own tag but never move `latest`,
          # and neither does a stable tag below the highest one (verify: latest).
          tags="$VERSION"
          case "$VERSION" in *-*) ;; *) [ "$LATEST" = true ] && tags="$tags latest" ;; esac
          for t in $IMAGES; do
            for a in amd64 arm64; do
              docker push "$REGISTRY/$owner/$t:$VERSION-$a"
            done
          done
          # Every :VERSION first, then the moving tags, so a registry error part
          # way through never moves `latest` onto a mixed-version set.
          for tag in $tags; do
            for t in $IMAGES; do
              image="$REGISTRY/$owner/$t"
              docker buildx imagetools create -t "$image:$tag" "$image:$VERSION-amd64" "$image:$VERSION-arm64"
            done
          done

  # The release feed (RELEASING.md): a small signed JSON file that tells running
  # controllers and UIs a newer version exists. It runs after `publish`, so a problem here
  # (a missing signing secret, a bad feed) turns this job red but never withholds the images.
  # It creates the GitHub release if there is none, and attaches `release-feed.json` and its
  # `.minisig` to it; readers fetch releases/latest/download/release-feed.json.
  release-feed:
    needs: [verify, publish]
    runs-on: ubuntu-24.04   # pinned like ci.yml
    timeout-minutes: 20
    permissions:
      contents: write   # create the release and attach the feed
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      LATEST: ${{ needs.verify.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Create the GitHub release if there is none
        run: |
          set -eu
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $TAG exists"
            exit 0
          fi
          flags=""
          case "$TAG" in *-*) flags="--prerelease --latest=false" ;; *)
            if [ "$LATEST" = true ]; then flags="--latest"; else flags="--latest=false"; fi ;;
          esac
          # shellcheck disable=SC2086
          gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes --verify-tag $flags
      - name: Build, sign and attach the feed
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.RELEASE_MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.RELEASE_MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::RELEASE_MINISIGN_SECRET_KEY is not set: no release feed was published (the images are out)"
            exit 1
          fi
          cargo build --locked --release -p wayhouse-registry --bin wayhouse-registry-gen
          gen=target/release/wayhouse-registry-gen
          work=$(mktemp -d)
          key="$work/release.key"
          ( umask 077; printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key" )
          trap 'rm -rf "$work"' EXIT
          gh api "repos/$REPO/releases" --paginate > "$work/releases.json"
          "$gen" release-feed --releases "$work/releases.json" --out "$work/release-feed.json"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -t "wayhouse-v1 release-feed" \
            -m "$work/release-feed.json" -x "$work/release-feed.json.minisig"
          # The same check a controller makes, with the key compiled into this build: a feed
          # that would not verify in the field never gets attached.
          "$gen" verify-release-feed "$work/release-feed.json" "$work/release-feed.json.minisig"
          gh release upload "$TAG" --repo "$REPO" --clobber \
            "$work/release-feed.json" "$work/release-feed.json.minisig"
