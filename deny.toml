# cargo-deny policy. Advisories are ignored in .cargo/audit.toml (cargo audit); this file
# covers licenses, sources and banned crates.
[graph]
all-features = true

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "0BSD", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
multiple-versions = "allow"
