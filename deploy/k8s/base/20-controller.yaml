apiVersion: apps/v1
kind: Deployment
metadata: { name: wayhouse-controller, namespace: wayhouse }
spec:
  replicas: 1                    # single standalone node; HA (Raft) is documented in docs/10
  strategy: { type: Recreate }   # the controller store is single-writer
  selector: { matchLabels: { app: wayhouse-controller } }
  template:
    metadata: { labels: { app: wayhouse-controller } }
    spec:
      securityContext: { fsGroup: 65532, runAsNonRoot: true }
      # Only needed if you pull from a mirror that requires auth (the ghcr.io images are public).
      # imagePullSecrets: [{ name: ghcr }]
      containers:
        - name: controller
          image: wayhouse-deploy/wayhouse-controller:local
          args: ["--listen=0.0.0.0:9901", "--data-dir=/data", "--auth-token-file=/run/secrets/wayhouse/auth-token"]
          ports: [{ containerPort: 9901 }]
          readinessProbe: { httpGet: { path: /healthz, port: 9901 } }
          livenessProbe: { httpGet: { path: /healthz, port: 9901 }, initialDelaySeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /data }, { name: tokens, mountPath: /run/secrets/wayhouse, readOnly: true }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: wayhouse-controller-data }
        - name: tokens
          secret:
            secretName: wayhouse-tokens
            defaultMode: 0440   # group-readable; fsGroup gives the container its group
            items: [{ key: controller-token, path: auth-token }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: wayhouse-controller-data, namespace: wayhouse }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: wayhouse-controller, namespace: wayhouse }
spec:
  selector: { app: wayhouse-controller }
  ports: [{ port: 9901, targetPort: 9901 }]
