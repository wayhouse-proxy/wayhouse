apiVersion: apps/v1
kind: Deployment
metadata: { name: wayhouse-ui, namespace: wayhouse }
spec:
  replicas: 1
  selector: { matchLabels: { app: wayhouse-ui } }
  template:
    metadata: { labels: { app: wayhouse-ui } }
    spec:
      securityContext: { fsGroup: 65532, runAsNonRoot: true }
      # Only needed if you pull from a mirror that requires auth (the ghcr.io images are public).
      # imagePullSecrets: [{ name: ghcr }]
      containers:
        - name: ui
          image: wayhouse-deploy/wayhouse-ui:local
          args:
            - --listen=0.0.0.0:9903
            - --ui-password-file=/run/secrets/wayhouse/ui-password
            - --controller-url=http://wayhouse-controller:9901
            - --controller-token-file=/run/secrets/wayhouse/controller-token
            - --aggregator-url=http://wayhouse-aggregator:9902
            - --aggregator-token-file=/run/secrets/wayhouse/aggregator-token
          ports: [{ containerPort: 9903 }]
          readinessProbe: { httpGet: { path: /healthz, port: 9903 } }
          livenessProbe: { httpGet: { path: /healthz, port: 9903 }, initialDelaySeconds: 10 }
          volumeMounts: [{ name: tokens, mountPath: /run/secrets/wayhouse, readOnly: true }]
      volumes:
        - name: tokens
          secret:
            secretName: wayhouse-tokens
            defaultMode: 0440   # group-readable; fsGroup gives the container its group
            items: [{ key: ui-password, path: ui-password }, { key: controller-token, path: controller-token }, { key: aggregator-token, path: aggregator-token }]
---
# ClusterIP only: front it with an Ingress / LoadBalancer (and TLS) yourself.
apiVersion: v1
kind: Service
metadata: { name: wayhouse-ui, namespace: wayhouse }
spec:
  selector: { app: wayhouse-ui }
  ports: [{ port: 9903, targetPort: 9903 }]
