apiVersion: apps/v1
kind: Deployment
metadata: { name: wayhouse-aggregator, namespace: wayhouse }
spec:
  replicas: 1
  selector: { matchLabels: { app: wayhouse-aggregator } }
  template:
    metadata: { labels: { app: wayhouse-aggregator } }
    spec:
      securityContext: { fsGroup: 65532, runAsNonRoot: true }
      # Only needed if you pull from a mirror that requires auth (the ghcr.io images are public).
      # imagePullSecrets: [{ name: ghcr }]
      containers:
        - name: aggregator
          image: wayhouse-deploy/wayhouse-aggregator:local
          # --instance-token is what intent fan-out presents to each wayhouse admin API.
          # --ingest-token is what each wayhouse pushes with; it cannot call /fleet/*.
          # A pushed admin_url must name the pusher's own address (the node IP
          # here); if nodes reach the Service from another address, add
          # --instance-url-allow=<node CIDR>.
          args:
            - --listen=0.0.0.0:9902
            - --auth-token-file=/run/secrets/wayhouse/auth-token
            - --ingest-token-file=/run/secrets/wayhouse/ingest-token
            - --instance-token-file=/run/secrets/wayhouse/instance-token
            - --allow-insecure-controller   # each node reports http://<node IP>:9900 and gets the instance token in plain http
          ports: [{ containerPort: 9902 }]
          readinessProbe: { httpGet: { path: /healthz, port: 9902 } }
          livenessProbe: { httpGet: { path: /healthz, port: 9902 }, initialDelaySeconds: 10 }
          volumeMounts: [{ name: tokens, mountPath: /run/secrets/wayhouse, readOnly: true }]
      volumes:
        - name: tokens
          secret:
            secretName: wayhouse-tokens
            defaultMode: 0440   # group-readable; fsGroup gives the container its group
            items: [{ key: aggregator-token, path: auth-token }, { key: ingest-token, path: ingest-token }, { key: admin-token, path: instance-token }]
---
apiVersion: v1
kind: Service
metadata: { name: wayhouse-aggregator, namespace: wayhouse }
spec:
  selector: { app: wayhouse-aggregator }
  ports: [{ port: 9902, targetPort: 9902 }]
