# EXAMPLE ONLY. Prefer `wayhouse-controller init --target k8s-secret --output secrets.yaml`, which makes
# this Secret with random values plus `wayhouse-keyring` and `wayhouse-tls` (the CA and the controller and
# aggregator certificates the manifests mount; this example does not carry them). Otherwise copy this,
# change every value, create the `wayhouse-tls` Secret yourself (keys ca.crt, controller.crt,
# controller.key, aggregator.crt, aggregator.key) and never commit real ones.
apiVersion: v1
kind: Secret
metadata: { name: wayhouse-tokens, namespace: wayhouse }
type: Opaque
stringData:
  controller-token: change-me-controller
  proxy-token: change-me-proxy-token-16+       # what proxies present to the controller (read-only scope)
  agent-token: change-me-agent-token-16+       # what tunnel agents present (peer registration only)
  aggregator-token: change-me-aggregator
  ingest-token: change-me-ingest              # what each wayhouse pushes with; unlocks only POST /ingest
  admin-token: change-me-admin-token          # must equal wayhouse.yaml's admin auth_token below
  ui-password: change-me-ui-password-16+
  ha-token: change-me-ha-peer-token-16+       # only the ha overlay reads it
---
# The wayhouse config is a Secret (not a ConfigMap) because it carries the admin
# auth_token: a hostNetwork pod is probed on the node IP, so the admin
# listener must bind 0.0.0.0 and must not be open.
apiVersion: v1
kind: Secret
metadata: { name: wayhouse-config, namespace: wayhouse }
type: Opaque
stringData:
  wayhouse.yaml: |
    settings:
      workers: 0
      shutdown_grace_sec: 30
      admin:
        listen: "0.0.0.0:9900"
        auth_token: "change-me-admin-token"   # /healthz stays open for the probe
    pools:
      - name: demo
        targets: ["10.0.0.10:25565"]    # your game servers
        balancer: round_robin
        health_check: { type: tcp_connect, interval_sec: 5, timeout_ms: 200, rise: 1, fall: 1 }
    listeners:
      - name: demo-tcp
        bind: "0.0.0.0:25565"
        protocol: tcp
        pool: demo
