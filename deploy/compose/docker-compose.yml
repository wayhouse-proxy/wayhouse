# Control-plane demo: controller + aggregator + ui on a bridge network, one
# wayhouse (host networking, docs/12's default for an edge process) that pulls its
# config from the controller and pushes state to the aggregator.
# Tokens come from .env and reach each container as a Docker secret file (/run/secrets/...),
# not on the command line. The `seed` job below still passes one to curl: demo only.
name: wayhouse-demo

x-build: &build
  context: ../..
  dockerfile: deploy/Dockerfile
  args:
    BIN_SOURCE: ${BIN_SOURCE:-builder}   # `prebuilt` = binaries from deploy/prebuilt (CI)
    WAYHOUSE_GIT_SHA: ${WAYHOUSE_GIT_SHA:-}   # shown as commit= in wayhouse_build_info (builder only)

services:
  controller:
    build: { <<: *build, target: wayhouse-controller }
    image: wayhouse-deploy/wayhouse-controller:local
    command:
      - --listen=0.0.0.0:9901
      - --data-dir=/data
      - --auth-token-file=/run/secrets/auth-token
      - --proxy-token-file=/run/secrets/proxy-token
      - --agent-token-file=/run/secrets/agent-token
    secrets:
      - { source: controller-token, target: auth-token }
      - proxy-token
      - agent-token
    ports: ["127.0.0.1:9901:9901"]   # wayhouse (host network) dials it here
    volumes: ["controller-data:/data"]
    restart: unless-stopped

  aggregator:
    build: { <<: *build, target: wayhouse-aggregator }
    image: wayhouse-deploy/wayhouse-aggregator:local
    command:
      - --listen=0.0.0.0:9902
      - --auth-token-file=/run/secrets/auth-token
      # wayhouse pushes with this one; it cannot read or drive /fleet/*.
      - --ingest-token-file=/run/secrets/ingest-token
      # wayhouse (host network) reports http://127.0.0.1:9900, which is not the
      # address the aggregator sees it connect from (the bridge gateway).
      - --instance-url-allow=127.0.0.0/8
    secrets:
      - { source: aggregator-token, target: auth-token }
      - ingest-token
    ports: ["127.0.0.1:9902:9902"]
    restart: unless-stopped

  ui:
    build: { <<: *build, target: wayhouse-ui }
    image: wayhouse-deploy/wayhouse-ui:local
    command:
      - --listen=0.0.0.0:9903
      - --ui-password-file=/run/secrets/ui-password
      - --controller-url=http://controller:9901
      - --controller-token-file=/run/secrets/controller-token
      - --aggregator-url=http://aggregator:9902
      - --aggregator-token-file=/run/secrets/aggregator-token
    secrets: [ui-password, controller-token, aggregator-token]
    ports: ["127.0.0.1:9903:9903"]
    depends_on: [controller, aggregator]
    restart: unless-stopped

  # One-shot: write revision 1 so `wayhouse --controller` has something to fetch
  # (it exits at startup against an empty controller).
  seed:
    image: curlimages/curl:8.11.1
    command:
      - -fsS
      # curl 8.11.1 rejects `--opt=value`: values are separate arguments.
      - --retry
      - "30"
      - --retry-delay
      - "1"
      - --retry-all-errors
      - -X
      - POST
      - -H
      - "Authorization: Bearer ${WAYHOUSE_CONTROLLER_TOKEN}"
      - --data-binary
      - "@/wayhouse.yaml"
      - http://controller:9901/config
    volumes: ["./wayhouse.yaml:/wayhouse.yaml:ro"]
    depends_on: [controller]
    restart: "no"

  wayhouse:
    build: { <<: *build, target: wayhouse }
    image: wayhouse-deploy/wayhouse:local
    network_mode: host
    command:
      - --controller=http://127.0.0.1:9901
      - --controller-token-file=/run/secrets/controller-token
      - --aggregator=http://127.0.0.1:9902
      - --aggregator-token-file=/run/secrets/aggregator-token
      - --aggregator-instance=demo-wayhouse
    secrets:
      - { source: proxy-token, target: controller-token }
      - { source: ingest-token, target: aggregator-token }
    depends_on:
      seed: { condition: service_completed_successfully }
      aggregator: { condition: service_started }
    restart: unless-stopped

# The tokens reach each container as files under /run/secrets (tmpfs), never on a command line.
# Compose builds them from the variables in .env.
secrets:
  controller-token: { environment: WAYHOUSE_CONTROLLER_TOKEN }
  proxy-token: { environment: WAYHOUSE_PROXY_TOKEN }
  agent-token: { environment: WAYHOUSE_AGENT_TOKEN }
  aggregator-token: { environment: WAYHOUSE_AGGREGATOR_TOKEN }
  ingest-token: { environment: WAYHOUSE_INGEST_TOKEN }
  ui-password: { environment: WAYHOUSE_UI_PASSWORD }

volumes:
  controller-data:
