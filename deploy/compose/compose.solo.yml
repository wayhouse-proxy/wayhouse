# Solo bundle (docs/12-deployment.md, "One box"): the demo stack plus what a single box needs for
# everything in 0.4 to work: plugins and a sealed secret store. Use it as an overlay:
#   wayhouse-controller init --target compose   # once: .env with random tokens and ./tls with a
#                                                # private CA and the certificates (never prints a secret)
#   docker compose -f docker-compose.yml -f compose.solo.yml up -d --build
# Add compose.web.yml for the Caddy front door, compose.solo-acme.yml for certificates.
#
# What it adds to the demo:
#   keys        one-shot that creates the sealed-secret keyring on first start and leaves it alone
#               after that (a lost keyring makes every stored secret unreadable: back up the volume)
#   controller  --plugins and --secret-key-file, so plugin secrets and `{ secret: name }` work
#   wayhouse    the same key file, read-only, to open `{ secret: name }` values at start
#   settings    every program gets --settings-dir=/settings (one shared volume, all running as 65532),
#               so the UI's "Process flags" page can change their flags with a trial apply that
#               goes back by itself (docs/12-deployment.md, "Process flags from a settings file")
#
# Everything is published on the host's loopback only. The controller and the aggregator serve
# https inside the compose network (certificates from `init`, copied into the solo-tls volume by
# the keys step), and every client trusts the init CA with --ca-file, so no flag turns off the
# plain-http guards: --allow-insecure-controller and --allow-insecure-secrets appear nowhere here.
services:
  keys:
    image: busybox:1.37.0
    command:
      - sh
      - -c
      - |
        set -eu
        umask 077
        [ -s /keys/secret.keys ] || { head -c 32 /dev/urandom | base64 > /keys/secret.keys.tmp && mv /keys/secret.keys.tmp /keys/secret.keys; }
        chown 65532:65532 /keys /keys/secret.keys
        chmod 0700 /keys
        chmod 0600 /keys/secret.keys
        chown 65532:65532 /settings
        chmod 0700 /settings
        [ -f /tls-src/ca.pem ] || { echo "no certificates in WAYHOUSE_TLS_DIR: run wayhouse-controller init --target compose first" >&2; exit 1; }
        mkdir -p /tls
        want="ca.pem $${TLS_FILES:-controller.pem controller.key aggregator.pem aggregator.key}"
        for f in $$want; do cp "/tls-src/$$f" "/tls/$$f"; done
        # a layout switch (split <-> all-in-one) must not leave the other layout's keys in the volume
        for f in /tls/*; do case " $$want " in *" $$(basename "$$f") "*) ;; *) rm -f "$$f" ;; esac; done
        chown -R 65532:65532 /tls
        chmod 0755 /tls
        chmod 0644 /tls/*.pem
        chmod 0600 /tls/*.key
    volumes:
      - solo-keys:/keys
      - solo-settings:/settings
      - solo-tls:/tls
      - ${WAYHOUSE_TLS_DIR:-./tls}:/tls-src:ro
    restart: "no"

  controller:
    command:
      - --listen=0.0.0.0:9901
      - --data-dir=/data
      - --auth-token-file=/run/secrets/auth-token
      - --proxy-token-file=/run/secrets/proxy-token
      - --agent-token-file=/run/secrets/agent-token
      - --plugins
      - --secret-key-file=/keys/secret.keys
      - --tls-cert=/tls/controller.pem
      - --tls-key=/tls/controller.key
      - --settings-dir=/settings
    volumes:
      - controller-data:/data
      - solo-keys:/keys:ro
      - solo-settings:/settings
      - solo-tls:/tls:ro
    depends_on:
      keys: { condition: service_completed_successfully }

  wayhouse:
    command:
      - --controller=https://127.0.0.1:9901
      - --controller-token-file=/run/secrets/controller-token
      - --aggregator=https://127.0.0.1:9902
      - --aggregator-token-file=/run/secrets/aggregator-token
      - --aggregator-instance=demo-wayhouse
      - --ca-file=/tls/ca.pem
      - --secret-key-file=/keys/secret.keys
      - --settings-dir=/settings
    volumes:
      - solo-keys:/keys:ro
      - solo-settings:/settings
      - solo-tls:/tls:ro
    depends_on:
      keys: { condition: service_completed_successfully }

  aggregator:
    command:
      - --listen=0.0.0.0:9902
      - --auth-token-file=/run/secrets/auth-token
      - --ingest-token-file=/run/secrets/ingest-token
      - --instance-url-allow=127.0.0.0/8
      - --tls-cert=/tls/aggregator.pem
      - --tls-key=/tls/aggregator.key
      - --settings-dir=/settings
    volumes: ["solo-settings:/settings", "solo-tls:/tls:ro"]
    depends_on:
      keys: { condition: service_completed_successfully }

  ui:
    command:
      - --listen=0.0.0.0:9903
      - --ui-password-file=/run/secrets/ui-password
      - --controller-url=https://controller:9901
      - --controller-token-file=/run/secrets/controller-token
      - --aggregator-url=https://aggregator:9902
      - --aggregator-token-file=/run/secrets/aggregator-token
      - --ca-file=/tls/ca.pem
      - --settings-dir=/settings
    volumes: ["solo-settings:/settings", "solo-tls:/tls:ro"]
    depends_on:
      keys: { condition: service_completed_successfully }

  # The base file's one-shot that writes revision 1; it has to speak https here and trust the CA
  # (curl 8.11.1 rejects `--opt=value`, so values are separate arguments, as in the base).
  seed:
    command:
      - -fsS
      - --cacert
      - /tls/ca.pem
      - --retry
      - "30"
      - --retry-delay
      - "1"
      - --retry-all-errors
      - -X
      - POST
      - -H
      - "Authorization: Bearer ${WAYHOUSE_CONTROLLER_TOKEN}"
      - --data-binary
      - "@/wayhouse.yaml"
      - https://controller:9901/config
    volumes: ["./wayhouse.yaml:/wayhouse.yaml:ro", "solo-tls:/tls:ro"]
    depends_on:
      keys: { condition: service_completed_successfully }

volumes:
  solo-keys:
  solo-settings:
  solo-tls:
