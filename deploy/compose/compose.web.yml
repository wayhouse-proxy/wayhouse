# Web front door (docs/web-proxy.md): Caddy plus wayhouse-web-sync next to the demo's
# wayhouse. Both share the host network with wayhouse, because wayhouse reaches Caddy on
# the host's loopback (the `web` pool) and Caddy must see the tunnel interface to reach
# origins behind wayhouse-agent. Use:
#   docker compose -f docker-compose.yml -f compose.web.yml up --build
# and give wayhouse a config with a `web:` section (wayhouse-web.yaml shows one).
services:
  caddy:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: wayhouse-caddy
    image: wayhouse-deploy/wayhouse-caddy:local
    network_mode: host
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      # The admin socket (owner-only) is shared with web-sync through this volume.
      - caddy-run:/run/caddy
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  # The sync ships in the wayhouse image: a second service from the same image.
  web-sync:
    image: wayhouse-deploy/wayhouse:local
    entrypoint: ["/usr/local/bin/wayhouse-web-sync"]
    command:
      - --wayhouse-admin=http://127.0.0.1:9900
      - --caddy-admin=/run/caddy/admin.sock
      # The console reads the sync's status here (Configure > Web sites). It is on the host network, so
      # a non-loopback address needs the token below.
      - --metrics-listen=0.0.0.0:9904
      - --metrics-token-file=/run/secrets/web-sync-token
    secrets: [web-sync-token]
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - caddy-run:/run/caddy
    depends_on: [caddy]
    restart: unless-stopped

  # The console shows the sync's last success. Compose replaces a `command` list whole, so this
  # restates the ui service's flags from docker-compose.yml and adds the two --web-sync ones.
  ui:
    command:
      - --listen=0.0.0.0:9903
      - --ui-password-file=/run/secrets/ui-password
      - --controller-url=http://controller:9901
      - --allow-insecure-controller   # tokens cross the private compose network in plain http
      - --controller-token-file=/run/secrets/controller-token
      - --aggregator-url=http://aggregator:9902
      - --aggregator-token-file=/run/secrets/aggregator-token
      - --web-sync-url=http://host.docker.internal:9904
      - --web-sync-token-file=/run/secrets/web-sync-token
    extra_hosts: ["host.docker.internal:host-gateway"]
    secrets:
      - ui-password
      - { source: ui-token, target: controller-token }
      - aggregator-token
      - web-sync-token

secrets:
  web-sync-token: { environment: WAYHOUSE_WEB_SYNC_TOKEN }

volumes:
  caddy-run:
  caddy-data:
  caddy-config:
