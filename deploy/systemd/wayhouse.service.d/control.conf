# Install as /etc/systemd/system/wayhouse.service.d/control.conf to run the proxy next to
# wayhouse-control instead of the split controller/aggregator units. The aggregator serves https
# there (one certificate for the process), so the proxy dials it with https; --ca-file is already
# set.
[Unit]
Wants=
After=
Wants=wayhouse-control.service
After=wayhouse-control.service
PartOf=
PartOf=wayhouse-solo-control.target

[Service]
ExecStart=
ExecStart=/usr/local/bin/wayhouse \
  --controller=https://127.0.0.1:9901 \
  --ca-file=/etc/wayhouse/tls/ca.pem \
  --aggregator=https://127.0.0.1:9902 \
  --aggregator-instance=solo \
  --secret-key-file=/var/lib/wayhouse/secret.keys
